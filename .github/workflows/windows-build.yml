# Continuous Windows packages use the desktop release build steps and retain
# installers as Actions artifacts, independently of version tags and releases.
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer and portable app
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-build-x64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        working-directory: apps/desktop
        run: |
          # Updater packages require the upstream release signing key. This
          # build produces directly installable NSIS and portable artifacts.
          $config = Join-Path $env:RUNNER_TEMP 'tauri-windows-build.json'
          @{ bundle = @{ createUpdaterArtifacts = $false } } |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $config -Encoding utf8
          bun run tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config $config

      - name: Collect installer and portable app
        run: |
          $releaseDir = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release'
          $installer = @(Get-ChildItem "$releaseDir/bundle/nsis/*-setup.exe")
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)" }
          $version = (Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $base = "ReadAware-v$version-windows-x64"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName -Destination "artifacts/$base-setup.exe"
          $portableDir = Join-Path $env:RUNNER_TEMP 'readaware-portable'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "$releaseDir/read-aware-desktop.exe" (Join-Path $portableDir 'ReadAware.exe')
          Compress-Archive -Path (Join-Path $portableDir 'ReadAware.exe') -DestinationPath "artifacts/$base-portable.zip"
          Get-ChildItem 'artifacts/*.exe', 'artifacts/*.zip' -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding utf8

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReadAware-windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
